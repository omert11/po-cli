[package]
name = "po-cli"
version = "0.1.2"
edition = "2021"
description = "CLI for analyzing and updating Django gettext .po files"
license = "MIT"

[[bin]]
name = "po-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
polib = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
regex = "1.12"
colored = "3.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
